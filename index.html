<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b3550" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="preload" href="/portraits/gorran-enraged.webp" as="image" />
    <title>enrage</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Fight arena"></canvas>
      <div id="vignette" aria-hidden="true"></div>

      <header id="hud" aria-live="polite">
        <section class="fighter player">
          <img src="/portraits/wren.webp" alt="" />
          <h2>Wren</h2>
          <div class="bar"><i class="chip"></i><i class="fill"></i></div>
        </section>
        <section class="fighter npc">
          <img class="calm" src="/portraits/gorran-calm.webp" alt="Calm" />
          <h2>Gorran</h2>
          <div class="bar"><i class="chip"></i><i class="fill"></i></div>
        </section>
      </header>

      <div id="voice">
        <p></p>
        <svg viewBox="-18 -18 60 60" aria-hidden="true">
          <circle cx="12" cy="12" r="29" />
          <circle class="timer" cx="12" cy="12" r="29" pathLength="1" transform="rotate(-90 12 12)" />
          <path d="M12 19v3" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><rect x="9" y="2" width="6" height="13" rx="3" />
        </svg>
        <span>Hold <kbd>Space</kbd> to speak</span>
      </div>

      <footer id="controls" aria-label="Controls">
        <span><kbd>Mouse</kbd> look</span>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
        <span><kbd>Shift</kbd> sprint / dash</span>
        <span><kbd>Left click</kbd> strike</span>
      </footer>

      <aside id="debug"></aside>

      <div id="result" hidden>
        <h1></h1>
        <p></p>
        <button type="button">Rematch <kbd>R</kbd></button>
      </div>

      <div id="loading">
        <h1>enrage</h1>
        <div class="progress"><i></i></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
